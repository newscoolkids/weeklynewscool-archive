<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴스쿨 아카이브 - READ NEWS, LEAD YOUTH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
/* --- 디자인 변수 --- */
:root {
  --newscool-green: #56c16f; --newscool-orange: #ffae00;
  --ink: #1C1917; --muted: #78716C; --faint: #A8A29E;
  --border: #E7E5E4; --bg: #FAFAF9; --surface: #FFFFFF;
  --sans: 'Noto Sans KR', sans-serif; --serif: 'Noto Serif KR', serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
a { text-decoration: none; color: inherit; }

/* --- 상단 블랙 헤더 --- */
.main-header {
  background: #000; color: #fff; height: 80px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 40px; position: sticky; top: 0; z-index: 1000;
}
.header-logo img { height: 32px; display: block; }
.main-nav { display: flex; gap: 18px; list-style: none; }
.main-nav a { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.8); white-space: nowrap; }
.main-nav a:hover, .main-nav a.active { color: var(--newscool-green); }

/* --- 검색 및 필터 바 --- */
.archive-toolbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 12px 20px; display: flex; align-items: center; justify-content: center; gap: 20px;
  position: sticky; top: 80px; z-index: 999;
}
.search-box { flex: 1; max-width: 400px; position: relative; }
.search-box input { width: 100%; height: 38px; padding: 0 12px 0 38px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; color: var(--faint); }

.filter-strip { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 0; }
.filter-rows { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
.filter-row { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.filter-row-label { font-size: 11px; font-weight: 900; color: var(--faint); min-width: 35px; }
.filter-group { display: flex; gap: 6px; }
.chip { height: 28px; padding: 0 12px; border-radius: 14px; border: 1.5px solid var(--border); font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; display: flex; align-items: center; }
.chip.active { background: var(--ink); border-color: var(--ink); color: #fff; }

/* --- 리스트 --- */
.main { max-width: 1100px; margin: 0 auto; padding: 20px; }
.list-header { display: grid; grid-template-columns: 50px 90px 40px 1fr 180px 80px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); font-size: 11px; color: var(--faint); font-weight: 700; }
.list-row { display: grid; grid-template-columns: 50px 90px 40px 1fr 180px 80px; padding: 12px 0; border-bottom: 1px solid var(--border); align-items: center; cursor: pointer; }
.list-row:hover { background: #f5f4f2; }
.row-title { font-weight: 700; font-size: 14px; }
.cat-tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: #eee; }

/* 상태 표시 */
#statusMsg { text-align: center; padding: 100px 20px; font-weight: 500; color: var(--muted); }

@media (max-width: 900px) {
  .main-nav { display: none; }
  .list-header, .list-row { grid-template-columns: 40px 1fr 70px; }
  .col-date, .col-curr, .h-date, .h-curr { display: none; }
}
</style>
</head>
<body>

<header class="main-header">
  <a href="https://www.newscool.co" class="header-logo"><img src="https://storage.googleapis.com/cdn.media.bluedot.so/bluedot.newscool/2023/01/oewru5_로고.png" alt="뉴스쿨"></a>
  <ul class="main-nav">
    <li><a href="https://www.newscool.co/guidetonewscool/">활용 꿀팁</a></li>
    <li><a href="https://www.newscool.co/tag/news/">News</a></li>
    <li><a href="https://www.newscool.co/tag/tv/">뉴스쿨TV</a></li>
    <li><a href="#" class="active">아카이브</a></li>
    <li><a href="https://www.newscool.co/shop/">스토어</a></li>
  </ul>
</header>

<div class="archive-toolbar">
  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.5-4.5"/></svg>
    <input type="text" id="searchInput" placeholder="뉴스 제목 검색..." autocomplete="off">
  </div>
  <div id="resultCount" style="font-size:12px; color:var(--muted);">0개</div>
</div>

<div class="filter-strip">
  <div class="filter-rows">
    <div class="filter-row">
      <span class="filter-row-label">연도</span>
      <div class="filter-group" id="yearChips"></div>
    </div>
  </div>
</div>

<div class="main">
  <div id="statusMsg">데이터를 불러오는 중입니다...</div>
  <div id="listTable" style="display:none;">
    <div class="list-header">
      <span>No.</span><span class="h-date">발행일</span><span></span><span>제목</span><span class="h-curr">교과</span><span style="text-align:right">분야</span>
    </div>
    <div id="cardContainer"></div>
  </div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSzdSzgrUGAed3WCyukDYSkkwSRedXkvwaeVquAlCHx2iqoZLhU8CDvOJ7vhYBOnIZ6naIqju_DSBLO/pub?output=csv&gid=0';

let _data = [];
let activeYear = 'all', searchQ = '';

function initYearFilters() {
  const yc = document.getElementById('yearChips');
  yc.innerHTML = '';
  const years = ['all', '2026', '2025', '2024', '2023', '2022'];
  years.forEach(y => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (y === activeYear ? ' active' : '');
    btn.textContent = y === 'all' ? '전체' : y + '년';
    btn.onclick = () => {
      activeYear = y;
      document.querySelectorAll('#yearChips .chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    };
    yc.appendChild(btn);
  });
}

function render() {
  const container = document.getElementById('cardContainer');
  const items = _data.filter(d => {
    const yOk = activeYear === 'all' || (d.date && d.date.startsWith(activeYear));
    const sOk = !searchQ || (d.title && d.title.toLowerCase().includes(searchQ));
    return yOk && sOk;
  });

  document.getElementById('resultCount').textContent = items.length + '개';
  
  if (items.length === 0) {
    container.innerHTML = '<div style="padding:50px; text-align:center; color:#999;">검색 결과가 없어요.</div>';
    return;
  }

  container.innerHTML = items.map(item => `
    <div class="list-row" onclick="window.open('${item.url || '#'}', '_blank')">
      <div class="col-vol">${item.vol || '-'}</div>
      <div class="col-date">${(item.date || '').split(' ')[0].replace(/-/g, '.')}</div>
      <div style="text-align:center">${getIcon(item.category)}</div>
      <div class="col-title">
        <div class="row-title">${item.title || '제목 없음'}</div>
        <div style="font-size:11px; color:#A8A29E;"># ${item.keyword || ''}</div>
      </div>
      <div class="col-curr" style="font-size:11px; color:#78716C">
        ${item.subject ? `<b>[${item.subject}]</b> ` : ''}${item.unit || ''}
      </div>
      <div style="text-align:right">
        <span class="cat-tag">${(item.category || '기타').split(',')[0]}</span>
      </div>
    </div>
  `).join('');
}

function getIcon(cat) {
  const icons = {'과학':'🔬','사회':'🏙️','경제':'💰','환경':'🌿','세계':'🌏','역사':'📜','문화':'🎭'};
  return icons[(cat || '').split(',')[0]] || '📰';
}

async function loadData() {
  const status = document.getElementById('statusMsg');
  const table = document.getElementById('listTable');
  
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('시트 접근 실패');
    const text = await res.text();
    const rows = text.split('\n').slice(1);
    
    _data = rows.map(row => {
      const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
      return {
        vol: cols[0]?.replace(/"/g,'').trim(),
        title: cols[1]?.replace(/"/g,'').trim(),
        category: cols[2]?.replace(/"/g,'').trim(),
        keyword: cols[3]?.replace(/"/g,'').trim(),
        date: cols[4]?.replace(/"/g,'').trim(),
        url: cols[5]?.replace(/"/g,'').trim(),
        subject: cols[6]?.replace(/"/g,'').trim(),
        unit: cols[8]?.replace(/"/g,'').trim()
      };
    }).filter(d => d.vol && d.title && d.title !== 'coming soon!');

    status.style.display = 'none';
    table.style.display = 'block';
    render();
  } catch (e) {
    status.innerHTML = '❌ 데이터를 불러오지 못했습니다.<br><br>구글 시트가 [웹에 게시] 상태인지 확인해 주세요.';
    console.error(e);
  }
}

document.getElementById('searchInput').oninput = (e) => {
  searchQ = e.target.value.toLowerCase();
  render();
};

initYearFilters();
loadData();
</script>
</body>
</html>
