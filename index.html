<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이번 주 뉴스쿨 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1C1917;
  --ink2: #44403C;
  --muted: #78716C;
  --faint: #A8A29E;
  --border: #E7E5E4;
  --bg: #FAFAF9;
  --surface: #FFFFFF;
  --red: #DC2626;
  --red-light: #FEF2F2;
  --yellow: #F59E0B;
  --yellow-light: #FFFBEB;
  --green: #16A34A;
  --green-light: #F0FDF4;
  --blue: #2563EB;
  --blue-light: #EFF6FF;
  --purple: #7C3AED;
  --purple-light: #F5F3FF;
  --teal: #0D9488;
  --teal-light: #F0FDFA;
  --font-sans: 'Noto Sans KR', sans-serif;
  --font-serif: 'Noto Serif KR', serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ── TOPBAR ── */
.topbar {
  background: var(--ink);
  color: white;
  padding: 0 20px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  letter-spacing: 0.05em;
}
.topbar-left { display: flex; align-items: center; gap: 16px; }
.topbar-logo {
  font-family: var(--font-serif);
  font-weight: 900;
  font-size: 13px;
  letter-spacing: 0.02em;
  color: white;
  text-decoration: none;
}
.topbar-sep { color: rgba(255,255,255,0.3); }
.topbar-label { color: rgba(255,255,255,0.6); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; }
.topbar-right { color: rgba(255,255,255,0.5); font-size: 10px; font-weight: 400; }

/* ── HEADER ── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.search-box {
  flex: 1;
  max-width: 340px;
  position: relative;
}
.search-box input {
  width: 100%;
  height: 34px;
  padding: 0 12px 0 34px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s;
}
.search-box input::placeholder { color: var(--faint); }
.search-box input:focus { border-color: var(--ink); background: white; }
.search-icon {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  width: 15px; height: 15px;
  color: var(--faint);
  pointer-events: none;
}
.result-count {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  margin-left: auto;
}
.result-count b { color: var(--ink); }

/* ── FILTER STRIP ── */
.filter-strip {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow: hidden;
}
.filter-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 6px;
  height: 40px;
  overflow-x: auto;
  scrollbar-width: none;
}
.filter-inner::-webkit-scrollbar { display: none; }
.filter-group {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.filter-divider {
  width: 1px;
  height: 16px;
  background: var(--border);
  margin: 0 4px;
  flex-shrink: 0;
}
.chip {
  height: 26px;
  padding: 0 10px;
  border-radius: 13px;
  border: 1.5px solid var(--border);
  background: transparent;
  font-size: 12px;
  font-weight: 500;
  font-family: var(--font-sans);
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.12s;
  display: flex;
  align-items: center;
  gap: 4px;
}
.chip:hover { border-color: var(--ink2); color: var(--ink2); }
.chip.active { background: var(--ink); border-color: var(--ink); color: white; }
.chip.cat-active-과학 { background: var(--blue); border-color: var(--blue); color: white; }
.chip.cat-active-사회 { background: var(--red); border-color: var(--red); color: white; }
.chip.cat-active-경제 { background: var(--yellow); border-color: var(--yellow); color: white; }
.chip.cat-active-환경 { background: var(--green); border-color: var(--green); color: white; }
.chip.cat-active-세계 { background: var(--teal); border-color: var(--teal); color: white; }
.chip.cat-active-역사 { background: #92400E; border-color: #92400E; color: white; }
.chip.cat-active-문화 { background: var(--purple); border-color: var(--purple); color: white; }
.chip.cat-active-정치 { background: #4B5563; border-color: #4B5563; color: white; }
.chip.cat-active-건강 { background: #BE185D; border-color: #BE185D; color: white; }
.chip-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}

/* ── HERO ── */
.hero {
  background: var(--ink);
  color: white;
  padding: 32px 20px 28px;
}
.hero-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
}
.hero-text {}
.hero-eyebrow {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  margin-bottom: 8px;
}
.hero-title {
  font-family: var(--font-serif);
  font-size: 28px;
  font-weight: 900;
  line-height: 1.2;
  color: white;
}
.hero-title em {
  font-style: normal;
  color: #FCD34D;
}
.hero-sub {
  margin-top: 8px;
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  line-height: 1.5;
}
.hero-stats {
  display: flex;
  gap: 24px;
  flex-shrink: 0;
}
.stat { text-align: right; }
.stat-n {
  font-family: var(--font-serif);
  font-size: 36px;
  font-weight: 900;
  color: white;
  line-height: 1;
}
.stat-l {
  font-size: 10px;
  color: rgba(255,255,255,0.4);
  margin-top: 3px;
  letter-spacing: 0.05em;
}

/* ── LAYOUT ── */
.main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px 60px;
}

/* ── YEAR DIVIDER ── */
.year-divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 28px 0 14px;
}
.year-num {
  font-family: var(--font-serif);
  font-size: 15px;
  font-weight: 900;
  color: var(--muted);
  flex-shrink: 0;
}
.year-line { flex: 1; height: 1px; background: var(--border); }
.year-count {
  font-size: 11px;
  color: var(--faint);
  flex-shrink: 0;
}

/* ── GRID ── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
}

/* ── CARD ── */
.card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  animation: fadeUp 0.25s ease both;
  cursor: pointer;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(0,0,0,0.09);
  border-color: #D4D0CC;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* thumb */
.card-thumb {
  aspect-ratio: 16/9;
  background: var(--bg);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.card-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.3s ease;
}
.card:hover .card-thumb img { transform: scale(1.04); }
.thumb-placeholder {
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.thumb-placeholder .cat-icon { font-size: 22px; opacity: 0.4; }

/* vol badge */
.vol-badge {
  position: absolute;
  top: 8px; left: 8px;
  background: rgba(255,255,255,0.93);
  border-radius: 4px;
  padding: 2px 6px;
  font-size: 10px;
  font-weight: 700;
  color: var(--ink2);
  letter-spacing: 0.03em;
}

/* body */
.card-body {
  padding: 12px 14px 14px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.card-meta {
  display: flex;
  align-items: center;
  gap: 6px;
}
.cat-tag {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 3px;
}
.card-date {
  font-size: 10px;
  color: var(--faint);
  margin-left: auto;
}
.card-title {
  font-size: 13.5px;
  font-weight: 700;
  line-height: 1.45;
  color: var(--ink);
  flex: 1;
  word-break: keep-all;
}
.card-keyword {
  font-size: 10px;
  color: var(--faint);
  margin-top: 2px;
}
.card-keyword mark {
  background: #FEF08A;
  border-radius: 2px;
  padding: 0 1px;
  color: var(--ink2);
}

/* ── CATEGORY COLORS ── */
.cat-과학   { background: var(--blue-light);   color: var(--blue); }
.cat-사회   { background: var(--red-light);    color: var(--red); }
.cat-경제   { background: var(--yellow-light); color: #92400E; }
.cat-환경   { background: var(--green-light);  color: var(--green); }
.cat-세계   { background: var(--teal-light);   color: var(--teal); }
.cat-역사   { background: #FEF3C7; color: #92400E; }
.cat-문화   { background: var(--purple-light); color: var(--purple); }
.cat-정치   { background: #F3F4F6; color: #374151; }
.cat-건강   { background: #FDF2F8; color: #BE185D; }
.cat-WHO    { background: #F0FDF4; color: #166534; }
.cat-기타   { background: #F5F5F4; color: var(--muted); }

/* thumb placeholder bg */
.bg-과학   { background: #DBEAFE; }
.bg-사회   { background: #FEE2E2; }
.bg-경제   { background: #FEF3C7; }
.bg-환경   { background: #DCFCE7; }
.bg-세계   { background: #CCFBF1; }
.bg-역사   { background: #FEF3C7; }
.bg-문화   { background: #EDE9FE; }
.bg-정치   { background: #F3F4F6; }
.bg-건강   { background: #FDF2F8; }
.bg-WHO    { background: #F0FDF4; }
.bg-기타   { background: var(--bg); }

/* cat icons */
.icon-과학  { font-size: 26px; }
.icon-사회  { font-size: 26px; }
.icon-경제  { font-size: 26px; }
.icon-환경  { font-size: 26px; }
.icon-세계  { font-size: 26px; }
.icon-역사  { font-size: 26px; }
.icon-문화  { font-size: 26px; }
.icon-정치  { font-size: 26px; }
.icon-건강  { font-size: 26px; }

/* ── EMPTY ── */
.empty {
  text-align: center;
  padding: 80px 20px;
  display: none;
}
.empty .emoji { font-size: 36px; display: block; margin-bottom: 10px; }
.empty p { font-size: 14px; color: var(--muted); }

/* ── ADMIN ── */
.fab {
  position: fixed;
  bottom: 20px; right: 20px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--ink);
  color: white;
  border: none;
  font-size: 20px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s;
}
.fab:hover { transform: scale(1.08); }
.admin-panel {
  position: fixed;
  bottom: 72px; right: 20px;
  background: white;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  width: 300px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  z-index: 200;
  display: none;
}
.admin-panel.open { display: block; animation: slideUp 0.18s ease; }
@keyframes slideUp {
  from { opacity:0; transform: translateY(8px); }
  to   { opacity:1; transform: translateY(0); }
}
.admin-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 12px;
}
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.field label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.field input, .field select {
  padding: 7px 9px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  font-family: var(--font-sans);
  outline: none;
  transition: border-color 0.12s;
}
.field input:focus, .field select:focus { border-color: var(--ink); }
.add-btn {
  width: 100%;
  padding: 9px;
  background: var(--ink);
  color: white;
  border: none;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 700;
  font-family: var(--font-sans);
  cursor: pointer;
  transition: opacity 0.12s;
}
.add-btn:hover { opacity: 0.85; }
.admin-note { font-size: 10px; color: var(--faint); margin-top: 8px; line-height: 1.5; }

/* ── RESPONSIVE ── */
@media (max-width: 640px) {
  .hero-inner { flex-direction: column; align-items: flex-start; gap: 16px; }
  .hero-stats { gap: 20px; }
  .hero-title { font-size: 22px; }
  .card-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .topbar-right { display: none; }
  .admin-panel { width: calc(100vw - 40px); }
}
@media (max-width: 400px) {
  .card-grid { grid-template-columns: 1fr; }
}

mark { background: #FEF08A; border-radius: 2px; padding: 0 1px; }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <a href="https://www.newscool.co" class="topbar-logo">뉴스쿨</a>
    <span class="topbar-sep">|</span>
    <span class="topbar-label">이번 주 뉴스쿨 아카이브</span>
  </div>
  <div class="topbar-right">매주 금요일 발행 · 초등 시사 뉴스</div>
</div>

<!-- HEADER -->
<header>
  <div class="header-main">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.5-4.5"/>
      </svg>
      <input type="text" id="searchInput" placeholder="제목, 키워드, 분야 검색…" autocomplete="off">
    </div>
    <div class="result-count" id="resultCount"></div>

<!-- FILTER STRIP -->
<div class="filter-strip">

</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-inner">
    <div class="hero-text">
      <div class="hero-eyebrow">Weekly Archive</div>
      <h1 class="hero-title">매주 골라온<br><em>세상의 이야기</em></h1>
      <p class="hero-sub">초등학생 눈높이로 쓴 시사 뉴스 · 2022년 창간호부터 지금까지</p>
    </div>
    <div class="hero-stats">
      <div class="stat">
        <div class="stat-n" id="statTotal">136</div>

      <div class="stat">

<!-- MAIN -->
<div class="main">

    <span class="emoji">🔍</span>
    <p>검색 결과가 없어요.</p>
  </div>

</div>

<!-- ADMIN FAB -->
<button class="fab" id="fabBtn" title="새 호 추가">＋</button>
<div class="admin-panel" id="adminPanel">
  <div class="admin-title">✏️ 새 호 추가</div>
  <div class="field">
    <label>Vol. 번호</label>
    <input type="number" id="aVol" placeholder="예) 138">

    <label>제목 (주제)</label>

    <label>분야</label>

      <option>사회</option><option>과학</option><option>경제</option>
      <option>환경</option><option>세계</option><option>역사</option>
      <option>문화</option><option>정치</option><option>건강</option>
    </select>
  </div>
  <div class="field">
    <label>키워드</label>
    <input type="text" id="aKw" placeholder="예) 기후변화, 탄소">
  </div>
  <div class="field">
    <label>발행일 (YYYY-MM-DD)</label>
    <input type="text" id="aDate" placeholder="2025-03-07">
  </div>
  <div class="field">
    <label>온라인 기사 URL</label>
    <input type="text" id="aUrl" placeholder="https://www.newscool.co/...">
  </div>
  <div class="field">
    <label>썸네일 URL (선택)</label>
    <input type="text" id="aThumb" placeholder="이미지 주소">
  </div>
  <button class="add-btn" id="addBtn">추가하기</button>
  <p class="admin-note">추가 항목은 이 기기에 저장됩니다.<br>Google Sheets 업데이트 후 페이지를 재배포하면 전체 반영돼요.</p>
</div>

<script>
// ── 카테고리 색상·아이콘 ──
const CAT_CONFIG = {
  '과학': { icon: '🔬', dot: '#2563EB' },
  '사회': { icon: '🏙️', dot: '#DC2626' },
  '경제': { icon: '💰', dot: '#F59E0B' },
  '환경': { icon: '🌿', dot: '#16A34A' },
  '세계': { icon: '🌏', dot: '#0D9488' },
  '역사': { icon: '📜', dot: '#92400E' },
  '문화': { icon: '🎭', dot: '#7C3AED' },
  '정치': { icon: '🏛️', dot: '#4B5563' },
  '건강': { icon: '❤️', dot: '#BE185D' },
  'WHO':  { icon: '⭐', dot: '#16A34A' },
};
function catConfig(c) {
  const first = c.split(',')[0].trim();
  return CAT_CONFIG[first] || { icon: '📰', dot: '#A8A29E' };
}
function catClass(c) {
  const first = c.split(',')[0].trim();
  return CAT_CONFIG[first] ? first : '기타';
}

// ── 내장 데이터 (CSV에서 변환) ──
const BASE_DATA = [
  {"vol":"136","title":"세상을 뒤바꿀 양자컴퓨터의 세계","category":"과학","keyword":"양자물리학","date":"2025-02-21","url":"","thumb":""},
  {"vol":"135","title":"달콤한 초콜릿의 씁쓸한 비밀","category":"경제","keyword":"공정무역","date":"2025-02-14","url":"","thumb":""},

// ── 로컬 추가분 병합 ──
function getAllData() {
  const local = JSON.parse(localStorage.getItem('nc_added') || '[]');
  return [...local, ...BASE_DATA];
}

// ── 상태 ──
let activeYear = 'all';
let activeCat  = 'all';
let searchQ    = '';

// ── 연도·분야 목록 ──
const YEARS = ['2025','2024','2023','2022'];
const CATS  = ['사회','과학','경제','환경','세계','역사','문화','정치','건강'];

// ── 필터 칩 렌더 ──
function buildFilters() {
  const yc = document.getElementById('yearChips');
  const cc = document.getElementById('catChips');

  const allYearBtn = makeChip('전체', 'year', 'all', true);
  yc.appendChild(allYearBtn);
  YEARS.forEach(y => yc.appendChild(makeChip(y+'년', 'year', y)));

  const allCatBtn = makeChip('전체', 'cat', 'all', true);
  cc.appendChild(allCatBtn);
  CATS.forEach(c => {
    const cfg = catConfig(c);
    const dot = document.createElement('span');
    dot.className = 'chip-dot';
    dot.style.background = cfg.dot;
    const btn = makeChip(c, 'cat', c);
    btn.insertBefore(dot, btn.firstChild);
    cc.appendChild(btn);
  });
}

function makeChip(label, type, value, isActive = false) {
  const btn = document.createElement('button');
  btn.className = 'chip' + (isActive ? ' active' : '');
  btn.textContent = label;
  btn.dataset.type = type;
  btn.dataset.value = value;
  btn.addEventListener('click', () => setFilter(type, value));
  return btn;
}

function setFilter(type, value) {
  if (type === 'year') activeYear = value;
  else activeCat = value;

  document.querySelectorAll(`.chip[data-type="${type}"]`).forEach(b => {
    b.classList.remove('active');
    if (type === 'cat') {
      CATS.forEach(c => b.classList.remove(`cat-active-${c}`));
    }
  });

  const target = document.querySelector(`.chip[data-type="${type}"][data-value="${value}"]`);
  if (target) {
    if (type === 'cat' && value !== 'all') {
      target.classList.add(`cat-active-${value}`);
    } else {
      target.classList.add('active');
    }
  }
  render();
}

// ── 검색 ──
let searchTimer;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchQ = e.target.value.trim(); render(); }, 180);
});

// ── 필터링 ──
function filterData() {
  const q = searchQ.toLowerCase();
  return getAllData().filter(item => {
    const yearOk = activeYear === 'all' || (item.date && item.date.startsWith(activeYear));
    const catOk  = activeCat  === 'all' || item.category.includes(activeCat);
    const searchOk = !q ||
      item.title.toLowerCase().includes(q) ||
      item.keyword.toLowerCase().includes(q) ||
      item.category.toLowerCase().includes(q) ||
      item.vol.includes(q);
    return yearOk && catOk && searchOk;
  });
}

// ── 렌더 ──
function render() {
  const items = filterData();
  const container = document.getElementById('cardContainer');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('resultCount');

  count.innerHTML = `<b>${items.length}</b>개`;

  if (items.length === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  // 연도 그룹
  const groups = {};
  items.forEach(item => {
    const yr = item.date ? item.date.slice(0, 4) : '미정';
    if (!groups[yr]) groups[yr] = [];
    groups[yr].push(item);
  });

  const sortedYears = Object.keys(groups).sort((a, b) => b - a);
  let html = '';
  sortedYears.forEach(yr => {
    if (activeYear === 'all') {
      html += `<div class="year-divider">
        <span class="year-num">${yr}</span>
        <div class="year-line"></div>
        <span class="year-count">${groups[yr].length}개</span>
      </div>`;
    }
    html += `<div class="card-grid">`;
    groups[yr].forEach((item, i) => { html += renderCard(item, i); });
    html += `</div>`;
  });

  container.innerHTML = html;
}

function hl(text, q) {
  if (!q) return esc(text);
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return esc(text).replace(re, '<mark>$1</mark>');
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCard(item, idx) {
  const delay = Math.min(idx * 25, 250);
  const cfg = catConfig(item.category);
  const cc  = catClass(item.category);
  const dateStr = item.date ? item.date.replace(/-/g, '.') : '';
  const q = searchQ;

  const thumbHtml = item.thumb
    ? `<img src="${esc(item.thumb)}" alt="${esc(item.title)}" loading="lazy"
         onerror="this.parentElement.innerHTML='<div class=\\'thumb-placeholder bg-${cc}\\'><span class=\\'cat-icon\\'>${cfg.icon}</span></div>'">`
    : `<div class="thumb-placeholder bg-${cc}"><span class="cat-icon">${cfg.icon}</span></div>`;

  const link = item.url || 'https://www.newscool.co/tag/weekly/';
  const target = item.url ? 'target="_blank" rel="noopener"' : '';

  return `<a class="card" href="${esc(link)}" ${target} style="animation-delay:${delay}ms">
    <div class="card-thumb">
      ${thumbHtml}
      <span class="vol-badge">Vol.${esc(item.vol)}</span>
    </div>
    <div class="card-body">
      <div class="card-meta">
        <span class="cat-tag cat-${cc}">${hl(item.category.split(',')[0].trim(), q)}</span>
        <span class="card-date">${dateStr}</span>
      </div>
      <div class="card-title">${hl(item.title, q)}</div>
      ${item.keyword ? `<div class="card-keyword"># ${hl(item.keyword, q)}</div>` : ''}
    </div>
  </a>`;
}

// ── 어드민 ──
document.getElementById('fabBtn').addEventListener('click', () => {
  document.getElementById('adminPanel').classList.toggle('open');
});
document.getElementById('addBtn').addEventListener('click', () => {
  const item = {
    vol:      document.getElementById('aVol').value.trim(),
    title:    document.getElementById('aTitle').value.trim(),
    category: document.getElementById('aCat').value,
    keyword:  document.getElementById('aKw').value.trim(),
    date:     document.getElementById('aDate').value.trim(),
    url:      document.getElementById('aUrl').value.trim(),
    thumb:    document.getElementById('aThumb').value.trim(),

  };
  if (!item.vol || !item.title) { alert('Vol. 번호와 제목은 필수예요.'); return; }
  const local = JSON.parse(localStorage.getItem('nc_added') || '[]');
  local.unshift(item);
  localStorage.setItem('nc_added', JSON.stringify(local));
  ['aVol','aTitle','aKw','aDate','aUrl','aThumb'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('adminPanel').classList.remove('open');
  render();
  alert('✅ 추가됐어요!');
});

// ── 초기화 ──
buildFilters();
render();
</script>
